  <body class="login-page">
    <div class="min-vh-100 d-flex flex-row align-items-center">
      <div class="container">
        <div class="row justify-content-center">
          <div class="col-lg-5">
            <div class="card-group d-block d-md-flex row">
              <div class="card col-md-7 p-4 mb-0">
                <div class="card-body">
                  <h5 class="text-center mb-3 color-text-rossa">Welcome</h5>
                  <div class="text-center mb-3">
                    <img class="text-center mx-auto" src="assets/img/rossa.png" alt="Image Rossa">
                  </div>
                  
                  <p class="text-medium-emphasis mb-5">Lorem ipsum dolor sit amet consectetur. Elit pretium hac gravida nullam phasellus</p>
                  <div class="mb-4">
                    <input class="form-control" type="email" id="email" placeholder="Email" autocomplete="username">
                    <small class="form-text color-text-rossa">Lupa email?</small>
                  </div>
                  <div class="mb-4">
                    <input class="form-control" type="password" id="password" placeholder="Password" autocomplete="current-password">
                    <small class="form-text color-text-rossa">Lupa password?</small> <br>
                    <small class="form-text color-text-rossa">Belum pernah daftar? <span>Sign in</span></small>
                  </div>
                  <div class="alert alert-danger d-none" id="loginError" role="alert"></div>
                  <div class="row">
                    <div class="col-12 text-end">
                      <button class="btn btn-success px-4 text-end text-light" type="button" id="btnLogin">Masuk</button>
                    </div>
                  </div>
                </div>
              </div>
            
            </div>
